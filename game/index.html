<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline Courier — a 3D bush-pilot flight game</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1622;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: #eaf4ff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud.hidden { display: none; }
  .hud-top { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; }
  .hud-box { min-width: 92px; text-align: center; padding: 8px 10px 7px;
    background: rgba(8, 20, 34, 0.62); border: 1px solid rgba(120, 200, 255, 0.45);
    border-radius: 10px; box-shadow: 0 0 14px rgba(60, 160, 255, 0.25), inset 0 0 18px rgba(40, 120, 200, 0.18); }
  .hud-label { font-size: 11px; letter-spacing: 3px; color: #8fd0ff; }
  .hud-big { font-size: 30px; font-weight: 700; line-height: 1.05; color: #fff;
    text-shadow: 0 0 12px rgba(120, 210, 255, 0.9); font-variant-numeric: tabular-nums; }
  .hud-unit { font-size: 10px; letter-spacing: 2px; color: #a8c8e0; }
  .hud-compass { position: absolute; top: 96px; left: 50%; transform: translateX(-50%);
    width: 340px; height: 26px; overflow: hidden; background: rgba(8, 20, 34, 0.55);
    border: 1px solid rgba(120, 200, 255, 0.35); border-radius: 6px; }
  .compass-strip { position: absolute; top: 3px; left: 0; white-space: nowrap; will-change: transform; }
  .compass-strip .tick { display: inline-block; width: 34px; text-align: center;
    font-size: 13px; font-weight: 700; color: #cfe8ff; }
  .compass-needle { position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    color: #ffb02e; font-size: 11px; line-height: 1; }
  .hud-left { position: absolute; left: 16px; bottom: 54px; display: flex; flex-direction: column; gap: 10px; }
  .horizon { position: relative; width: 150px; height: 150px; border-radius: 50%; overflow: hidden;
    border: 3px solid rgba(160, 210, 255, 0.8); box-shadow: 0 0 18px rgba(60, 160, 255, 0.4); background: #123; }
  .horizon-inner { position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; will-change: transform; }
  .horizon-sky { height: 50%; background: linear-gradient(#3f8fd2, #9fd0f2); }
  .horizon-ground { height: 50%; background: linear-gradient(#8a6a42, #5a4630); }
  .horizon-fixed { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #fff; text-shadow: 0 0 6px #000; letter-spacing: 2px; }
  .gauge { width: 170px; }
  .gauge-label { font-size: 12px; letter-spacing: 2px; color: #cfe8ff; margin-bottom: 3px;
    text-shadow: 0 1px 3px #000; }
  .gauge-bar { height: 12px; border: 1px solid rgba(160, 210, 255, 0.6); border-radius: 6px;
    background: rgba(8, 20, 34, 0.7); overflow: hidden; }
  .gauge-fill { height: 100%; transition: width 0.15s linear; }
  .gauge-fill.fuel { background: linear-gradient(90deg, #2fae5f, #7be495); }
  .gauge-fill.fuel.low { background: linear-gradient(90deg, #d33, #ff7a5c); }
  .gauge-fill.dmg { background: linear-gradient(90deg, #ffb02e, #ff5a4e); }
  .hud-right { position: absolute; right: 16px; top: 14px; text-align: right; }
  .objective { background: rgba(8, 20, 34, 0.62); border: 1px solid rgba(255, 176, 46, 0.55);
    border-radius: 10px; padding: 10px 14px; box-shadow: 0 0 14px rgba(255, 176, 46, 0.25); }
  .obj-label { font-size: 11px; letter-spacing: 3px; color: #ffc65c; }
  .obj-name { font-size: 19px; font-weight: 700; color: #fff; }
  .obj-row { font-size: 15px; color: #d8ecff; margin-top: 2px; }
  .obj-arrow { display: inline-block; color: #ffb02e; font-size: 18px; margin-right: 8px; will-change: transform; }
  .mission-line { margin-top: 8px; font-size: 17px; font-weight: 700; letter-spacing: 1px;
    text-shadow: 0 1px 4px #000; }
  .mission-line.dim { font-size: 14px; font-weight: 600; color: #d8ecff; }
  .timer { margin-top: 6px; font-size: 34px; font-weight: 800; color: #fff;
    text-shadow: 0 0 14px rgba(120, 210, 255, 0.8); font-variant-numeric: tabular-nums; }
  .timer.urgent { color: #ff6a5e; text-shadow: 0 0 14px rgba(255, 60, 40, 0.9); }
  .hud-message { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%);
    font-size: 22px; font-weight: 800; letter-spacing: 1px; color: #ffd97a;
    text-shadow: 0 2px 8px #000, 0 0 18px rgba(255, 176, 46, 0.7); white-space: nowrap; }
  .hud-help { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 1px; color: rgba(220, 238, 255, 0.85);
    text-shadow: 0 1px 3px #000; white-space: nowrap; }

  /* ---------- Overlay screens ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; pointer-events: none; }
  .overlay.show { display: flex; pointer-events: auto; }
  .title-wrap { text-align: center; max-width: 860px; padding: 26px 30px;
    background: linear-gradient(rgba(6, 16, 30, 0.55), rgba(6, 16, 30, 0.78));
    border: 1px solid rgba(140, 200, 255, 0.35); border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
  .title-kicker { font-size: 13px; letter-spacing: 5px; color: #8fd0ff; }
  .title-main { margin: 6px 0 8px; font-size: 74px; line-height: 0.95; font-weight: 900;
    letter-spacing: 2px; color: #fff;
    text-shadow: 0 0 24px rgba(255, 176, 46, 0.65), 0 4px 0 rgba(0, 0, 0, 0.35); }
  .title-sub { font-size: 16px; color: #d8ecff; max-width: 640px; margin: 0 auto 18px; line-height: 1.45; }
  .mission-cards { display: flex; gap: 12px; justify-content: center; }
  .mission-card { flex: 1; max-width: 250px; text-align: left; padding: 14px 16px; cursor: pointer;
    background: rgba(10, 26, 44, 0.8); border: 2px solid var(--mc, #ffb02e); border-radius: 12px;
    transition: transform 0.12s ease, box-shadow 0.12s ease; }
  .mission-card:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5), 0 0 18px var(--mc, #ffb02e); }
  .card-key { display: inline-block; width: 26px; height: 26px; line-height: 26px; text-align: center;
    border-radius: 50%; background: var(--mc, #ffb02e); color: #10202f; font-weight: 800; }
  .card-name { font-size: 21px; font-weight: 800; margin: 8px 0 4px; color: #fff; }
  .card-tag { font-size: 13.5px; line-height: 1.4; color: #cfe2f2; min-height: 38px; }
  .card-time { font-size: 12px; color: #9fc6e4; margin-top: 8px; }
  .title-controls { margin-top: 18px; font-size: 13px; color: #bcd8ee; }
  .title-best { margin-top: 10px; font-size: 14px; font-weight: 700; color: #ffd97a; }
  .title-hint { margin-top: 8px; font-size: 14px; color: #fff; font-weight: 700; letter-spacing: 1px; }
  .end-wrap { text-align: center; max-width: 680px; padding: 30px 44px;
    background: rgba(6, 16, 30, 0.82); border: 1px solid rgba(140, 200, 255, 0.4);
    border-radius: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55); }
  .end-kicker { font-size: 13px; letter-spacing: 4px; color: #8fd0ff; }
  .end-title { margin: 6px 0; font-size: 52px; font-weight: 900; letter-spacing: 2px; }
  .end-reason { font-size: 16px; color: #d8ecff; margin-bottom: 18px; }
  .end-stats { display: flex; gap: 26px; justify-content: center; margin-bottom: 16px; }
  .end-num { font-size: 36px; font-weight: 800; color: #fff; text-shadow: 0 0 14px rgba(120, 210, 255, 0.7); }
  .end-lab { font-size: 11px; letter-spacing: 3px; color: #9fc6e4; }
  .end-hint { font-size: 14px; color: #fff; font-weight: 600; }
  @media (max-width: 900px) {
    .title-main { font-size: 48px; }
    .mission-cards { flex-direction: column; align-items: center; }
    .mission-card { max-width: 420px; width: 100%; }
    .hud-box { min-width: 70px; } .hud-big { font-size: 22px; }
    .hud-compass { width: 240px; }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Skyline Courier: fly the bush plane through rings and land on island strips"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud" class="hidden"></div>
<div id="overlay" class="overlay"></div>
<script src="./vendor/three.min.js"></script>
<script src="./src/config.js"></script>
<script src="./src/random.js"></script>
<script src="./src/world.js"></script>
<script src="./src/aircraft.js"></script>
<script src="./src/physics.js"></script>
<script src="./src/input.js"></script>
<script src="./src/hud.js"></script>
<script src="./src/audio.js"></script>
<script src="./src/render.js"></script>
<script src="./src/shots.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
